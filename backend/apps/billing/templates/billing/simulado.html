<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagamento simulado</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f5;
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #18181b; padding: 16px; }
    .card { width: 100%; max-width: 420px; background: #fff; border-radius: 20px; padding: 32px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.06); }
    .tag { display: inline-block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      background: #fef9c3; color: #854d0e; padding: 4px 10px; border-radius: 999px; }
    h1 { font-size: 22px; margin: 16px 0 4px; }
    .muted { color: #71717a; margin: 0 0 24px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0 0 28px; }
    dt { color: #71717a; } dd { margin: 0; text-align: right; font-weight: 500; }
    .total { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 14px; font: inherit; font-weight: 600; cursor: pointer; }
    .ok { background: #18181b; color: #fff; margin-bottom: 10px; }
    .ko { background: #f4f4f5; color: #18181b; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Ambiente de testes</span>
    <h1>{{ pagamento.ginasio.nome }}</h1>
    <p class="muted">Simulação do Vinti4Net. Nenhum valor é cobrado.</p>
    <dl>
      <dt>Descrição</dt><dd>{{ pagamento.descricao }}</dd>
      <dt>Cliente</dt><dd>{{ pagamento.nome_cliente }}</dd>
      <dt>Referência</dt><dd>{{ pagamento.referencia }}</dd>
      <dt>Total</dt><dd class="total">{{ pagamento.valor_cve }} CVE</dd>
    </dl>
    <form method="post">
      {% csrf_token %}
      <button class="ok" name="resultado" value="aprovado">Aprovar pagamento</button>
      <button class="ko" name="resultado" value="recusado">Recusar</button>
    </form>
  </main>
</body>
</html>
